# RTX PRO 6000 Blackwell Server Edition GPU (SM120 / Blackwell architecture) - On-Demand Runners
matcherConfig:
  exactMatch: true
  labelMatchers:
    - [self-hosted, linux, x64, gpu, sm120, on-demand]
    - [self-hosted, linux, x64, gpu, rtx-pro-6000, on-demand]
  priority: 10
fifo: true

runner_config:
  runner_os: linux
  runner_architecture: x64
  runner_name_prefix: flashinfer-gpu-g7e-od-
  runner_run_as: ubuntu

  # Allow IMDSv1 for compatibility with existing scripts (task_show_node_info.sh)
  runner_metadata_options:
    instance_metadata_tags: "enabled"
    http_endpoint: "enabled"
    http_tokens: "optional"
    http_put_response_hop_limit: 2

  # Use GPU-specific user-data script (Deep Learning AMI has Docker/NVIDIA pre-installed)
  userdata_template: ./templates/user-data-gpu.sh

  enable_organization_runners: true

  # Multiple labels for flexible targeting
  runner_extra_labels:
    - gpu
    - nvidia
    - rtx-pro-6000
    - sm120
    - blackwell
    - on-demand

  enable_ephemeral_runners: false

  # G7e instances have NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs (96 GB).
  # g7e.2xlarge is left out: 64 GiB host memory is below the peak of the
  # host-memory-heavy FlashInfer tests and limits JIT builds to MAX_JOBS=4.
  # The default lowest-price allocation takes 4xlarge first and falls back
  # to 8xlarge when 4xlarge capacity is short.
  instance_types:
    - g7e.4xlarge     # 16 vCPUs, 128 GiB, 1x RTX PRO 6000
    - g7e.8xlarge     # 32 vCPUs, 256 GiB, 1x RTX PRO 6000

  # On-demand instances (no spot)
  instance_target_capacity_type: on-demand

  # Scaling configuration
  # Pilot cap while full-suite durations and costs are measured; raise
  # after the G and VT on-demand vCPU quota has headroom for it.
  runners_maximum_count: 4
  delay_webhook_event: 30
  scale_down_schedule_expression: "cron(*/5 * * * ? *)"
  minimum_running_time_in_minutes: 15
  runner_boot_time_in_minutes: 15

  # No idle_config - jobs run several hours, so a warm pool would mostly idle

  # Tag instances so this pool's spend can be separated in Cost Explorer.
  runner_ec2_tags:
    RunnerPool: gpu-g7e-ondemand

  # Use the AWS Deep Learning Base AMI with Ubuntu 24.04. Unlike the PyTorch
  # Ubuntu 22.04 AMI used by the g5/g4dn pools, it lists G7e as supported and
  # ships the open kernel modules that Blackwell requires.
  ami:
    owners:
      - "898082745236"  # AWS Deep Learning AMI owner
    filter:
      name:
        - "Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 24.04) *"
      state:
        - available

  block_device_mappings:
    - device_name: /dev/sda1
      volume_size: 500
      volume_type: gp3
      delete_on_termination: true
      encrypted: true

  enable_ssm_on_runners: true
  enable_cloudwatch_agent: true

  runner_log_files:
    - log_group_name: syslog
      prefix_log_group: true
      file_path: /var/log/syslog
      log_stream_name: "{instance_id}"
    - log_group_name: user_data
      prefix_log_group: true
      file_path: /var/log/user-data.log
      log_stream_name: "{instance_id}/user_data"
